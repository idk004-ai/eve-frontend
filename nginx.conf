server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: mọi route đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy tới các service trong cluster (K8s internal DNS, namespace eve-dev)
    # Khớp với VITE_*_API_URL=/api/* trong .env.production
    location /api/user/ {
        proxy_pass http://user-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/route/ {
        proxy_pass http://route-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/booking/ {
        proxy_pass http://booking-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/payment/ {
        proxy_pass http://payment-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/seat-inventory/ {
        proxy_pass http://seat-inventory-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket support cho seat selection
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /api/fleet/ {
        proxy_pass http://fleet-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cache static assets có hash trong tên file
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
